[project]
name = "ir-copilot"
version = "0.1.0"
description = "Human-in-the-loop incident response copilot"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "IR-Copilot contributors" }]
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langfuse>=4.14.1",
    "langgraph>=1.2.9",
    "openai>=2.46.0",
    "pydantic>=2.13.4",
    "sentence-transformers>=5.6.0",
    "uvicorn[standard]>=0.51.0",
]

[tool.uv]
package = false
